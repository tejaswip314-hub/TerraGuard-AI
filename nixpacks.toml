# Nixpacks configuration for TerraGuardAI on Railway
# Explicit Python provider — installs Python 3.11 and pip into the Nix build env.
# Dependencies come from api/requirements.txt (flask is declared there; the
# production server, api/server.py, itself uses only the Python stdlib).

[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "python311Packages.setuptools", "python311Packages.wheel"]

[phases.install]
cmds = ["python -m pip install --upgrade pip", "python -m pip install --no-cache-dir -r api/requirements.txt"]

[start]
cmd = "python api/server.py"
